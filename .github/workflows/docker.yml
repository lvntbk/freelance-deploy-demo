name: Build and Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore tests/FreelanceDeployDemo.IntegrationTests/FreelanceDeployDemo.IntegrationTests.csproj

      - name: Run PostgreSQL integration tests
        run: >
          dotnet test
          tests/FreelanceDeployDemo.IntegrationTests/FreelanceDeployDemo.IntegrationTests.csproj
          --configuration Release
          --no-restore
          --logger "console;verbosity=normal"

      - name: Build Docker image
        run: docker build --tag freelance-demo:ci .
